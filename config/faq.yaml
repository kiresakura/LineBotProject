# 常見問題（FAQ）自動回覆
# 範例店家「小島咖啡」與其地址、地點皆為虛構，請換成你自己的內容。
#
# 每筆問答：
#   id        英文代號，不可重複（AI 回答標註出處時也會用到）
#   question  問題原文；顧客的訊息和它很像時也會回覆這筆
#   keywords  顧客訊息裡出現任一個詞就回覆這筆；同時命中多筆時，命中字數最多的優先
#   answer    回覆內容，可以多行
#   standalone: true  只在訊息幾乎只有這些關鍵字時回覆（適合問候、道謝），
#                     「您好，我想取消訂單」就不會被當成打招呼，而是繼續比對或轉真人

faqs:
  - id: greeting
    question: 你好
    keywords: [你好, 您好, 哈囉, 嗨]
    standalone: true
    answer: |
      您好！我是小島咖啡的 LINE 小幫手 ☕
      可以問我營業時間、地址、停車、訂位、付款方式、寵物與外帶外送；其他問題我會轉給店員。

  - id: hours
    question: 營業時間是幾點到幾點？
    keywords: [營業, 幾點開, 幾點關, 開門, 打烊, 公休]
    answer: 週二至週日 10:00–20:00，週一公休；臨時公休會另外公告。

  - id: location
    question: 店在哪裡？怎麼去？
    keywords: [地址, 在哪, 怎麼去, 位置, 捷運, 公車]
    answer: |
      📍 海風市港邊路 1 號（虛構地址）
      捷運海風站 2 號出口步行約 3 分鐘。

  - id: parking
    question: 附近有停車位嗎？
    keywords: [停車]
    answer: 店門口沒有專屬車位，附近的港邊路公有停車場步行約 2 分鐘。

  - id: reservation
    question: 可以訂位嗎？
    keywords: [訂位]
    answer: 可以！請留言「日期、時間、人數、聯絡電話」，店員確認後會回覆您；6 人以上請提前一天預約。

  - id: payment
    question: 可以用什麼方式付款？
    keywords: [付款, 刷卡, 信用卡, 行動支付, 現金]
    answer: 可以使用現金、信用卡與行動支付。

  - id: pets
    question: 可以帶寵物嗎？
    keywords: [寵物]
    answer: 歡迎！寵物請使用牽繩或提籠，店內備有寵物水碗。

  - id: wifi
    question: 店內有 Wi-Fi 和插座嗎？
    keywords: [wifi, 插座, 充電]
    answer: 有免費 Wi-Fi（密碼在櫃台），靠窗座位有插座。

  - id: takeout
    question: 可以外帶或外送嗎？
    keywords: [外帶, 外送, 外賣]
    answer: 飲品與甜點都可以外帶；外送只接受 10 杯以上的團購訂單，請留言數量與地址。

  - id: thanks
    question: 謝謝
    keywords: [謝謝, 感謝, 3q]
    standalone: true
    answer: 不客氣，期待您的光臨 ☕

# 相似詞：左邊是 keywords 裡用的詞，右邊是顧客可能的其他說法
synonyms:
  停車: [泊車, 車位]
  訂位: [預約, 訂桌, 預訂]
  寵物: [毛小孩, 狗狗, 貓咪, 帶狗, 帶貓]
  付款: [付錢, 結帳]
  wifi: [無線網路, 網路]

# 沒有關鍵字命中時，訊息與 question 至少要有多少比例的字相同才回覆（0～1）
min_similarity: 0.7
