# 營業時間與固定回覆規則（範例店家「小島咖啡」為虛構）

timezone: Asia/Taipei

# 每週營業時段：一天可以有多段，用逗號分隔；不營業寫 closed
# 結束時間早於開始時間代表營業到隔天，例如 "18:00-02:00"
business_hours:
  mon: closed
  tue: "10:00-20:00"
  wed: "10:00-20:00"
  thu: "10:00-20:00"
  fri: "10:00-20:00"
  sat: "10:00-20:00"
  sun: "10:00-20:00"

# 臨時公休日（YYYY-MM-DD）
closed_dates:
  - 2026-12-31

# FAQ 答不出來時：營業中的回覆
handoff_reply: 這個問題我先幫您轉給店員，已通知專人，會盡快回覆您 🙏

# FAQ 答不出來時：非營業時間的回覆（訊息一樣會記錄到待處理清單）
after_hours_reply: |
  目前是非營業時間（週二至週日 10:00–20:00）。
  您的訊息已記錄，店員會在營業時間回覆您 🙏

# 特定關鍵字回固定內容，優先於 FAQ；適合放菜單連結、當期活動
keyword_replies:
  - keywords: [菜單, menu, 價目]
    reply: |
      📋 菜單：https://example.com/menu
      （範例連結，請換成你的菜單網址或圖片）
  - keywords: [優惠, 活動, 折扣]
    reply: 🎉 本月活動：平日 14:00–17:00 甜點加飲品折 30 元。
